# Elle çalıştırılan teşhis: uygulamanın bir teşhis adresini çağırıp sonucu not olarak yazar
name: Teshis
on:
  workflow_dispatch:
    inputs:
      yol:
        description: 'Adres yolu, örn. /api/ses-asistan?durum=1'
        required: true
      veri:
        description: 'POST gövdesi (JSON, isteğe bağlı)'
        required: false
        default: ''
jobs:
  bak:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          VERI: ${{ inputs.veri }}
        run: |
          if [ -n "$VERI" ]; then
            out=$(curl -sS --max-time 60 -w " [sure=%{time_total}s]" -X POST -H 'Content-Type: application/json' --data "$VERI" "https://alka-tesisat.vercel.app${{ inputs.yol }}" 2>&1 | head -c 3500 | tr '\n' ' ' || true)
          else
            out=$(curl -sS --max-time 60 -o /dev/null -w "[kod=%{http_code} ilkbayt=%{time_starttransfer}s toplam=%{time_total}s] " "https://alka-tesisat.vercel.app${{ inputs.yol }}" 2>&1 | head -c 3500 | tr '\n' ' ' || true)
          fi
          echo "::notice title=Sonuc::$out"
