# Saatli hatırlatma bildirimleri: birkaç dakikada bir, saati gelmiş hatırlatmaları telefona bildirir.
# (Vercel'in ücretsiz planında zamanlayıcı günde bir kez çalışabildiği için GitHub'ın ücretsiz zamanlayıcısı kullanılıyor.)
name: Saatli hatırlatmalar
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Saati gelen hatırlatmaları bildir
        # Ayar eksikse bile iş "başarısız" olup her 5 dakikada e-posta atmasın; cevabı günlüğe yazar
        run: |
          out=$(curl -sS --max-time 60 "https://alka-tesisat.vercel.app/api/hatirlatma-bildirim?${{ github.event_name == 'workflow_dispatch' && 'teshis' || 'saatli' }}=1" 2>&1 || true)
          echo "::notice title=Sonuc::$out"
